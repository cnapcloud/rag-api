server:
  production: false
  workers: 1

dagster:
  endpoint: "http://localhost:3000"

s3:
  endpoint: "http://localhost:9000"
  access_key: "admin"
  secret_key: "password"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  insecure: true

postgres:
  host: "localhost"
  port: 5432
  dbname: "rag-api"
  user: "rag-api"
  password: "password"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "localhost"
  port: 6333
  insecure: true

redis:
  host: "localhost"
  port: 6379
  password: "redis"
  db: 0
  timeout_seconds: 2.0

queue_worker:
  enabled: true
  max_workers: 5

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10

ingestion:
  max_file_size_mb: 10
  min_content_chars: 200
  html_extraction_mode: "recall"

dedup:
  enabled: true

  simhash:
    ngram: 3
    num_bands: 4
    simhash_bits: 64
    hamming_identical_threshold: 2
    hamming_similar_threshold: 5

  minhash:
    jaccard_threshold: 0.65
    title_fuzzy_threshold: 0.85
    title_only_min_jaccard_floor: 0.25
    user_words_path: "data/kiwi_user_words.tsv"

  chunk_compare:
    chunk_match_threshold: 0.50
    body_identical_threshold: 0.95
    body_similar_threshold: 0.75
    compare_all_candidates: false

chunking:
  strategy: "recursive"
  chunk_size: 1024
  chunk_overlap: 128
  min_chunk_chars: 30
  semantic_threshold: 0.8
  code_chunk_lines: 40
  code_chunk_lines_overlap: 5

embedding:
  provider: "ollama"
  model: "bge-m3"
  vector_size: 1024
  ollama_url: "http://localhost:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 5
  hybrid:
    alpha: 0.5
    rrf_k: 60
  similarity:
    min_score: 0.0
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    name: "지식베이스 01"
    description: "첫 번째 지식베이스입니다."
    tags: ["general"]
  - id: "kb-02"
    name: "지식베이스 02"
    description: "두 번째 지식베이스입니다."

mcp:
  enabled: true
  transport: streamable-http

tracing:
  enabled: true
  langfuse_baseurl: "http://langfuse-web.llm.svc.cluster.local:3000"
  langfuse_public_key: "pk-lf-0142e4e5-b7e2-446f-8471-40be8d9c7009"
  langfuse_secret_key: "sk-lf-ad5e55e4-5a84-4442-ad6f-59170dff7900"
  service_name: "rag-api"

logging:
  level: INFO
  names: [rag_api]
