s3:
  endpoint: "http://192.168.0.185:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster-storage"
  region: "us-east-1"
  poll_interval_sec: 10
  insecure: true

qdrant:
  host: "192.168.0.184"
  port: 6333
  insecure: true

redis:
  host: "192.168.0.183"
  port: 6379
  password: "redis"
  db: 0

ingestion:
  max_file_size_mb: 10

queue_worker:
  enabled: false   # dgster는 비활성화됨
  max_workers: 5

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10 # 동일 문서 재시도 간격

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://localhost:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 10
  alpha: 0.5 # alpha=1.0 → dense(벡터 유사도 100%), alpha=0.0 → sparse(키워드 매칭 100%)
  merge_strategy: "rrf"
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    description: "지식베이스 01"
  - id: "kb-02"
    description: "지식베이스 02"

mcp:
  enabled: true
  transport: stdio

logging:
  level: INFO
