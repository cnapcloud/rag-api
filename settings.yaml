dagster:
  endpoint: "http://localhost:3000"

s3:
  endpoint: "http://192.168.0.185:9000"
  access_key: "admin"
  secret_key: "password"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  insecure: true

postgres:
  host: "postgresql"
  port: 5432
  dbname: "rag-api"
  user: "rag-api"
  password: "password"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "192.168.0.184"
  port: 6333
  insecure: true

redis:
  host: "192.168.0.183"
  port: 6379
  password: "redis"
  db: 0

ingestion:
  max_file_size_mb: 10        # upload file size limit
  min_content_chars: 200      # web connector only: skip crawled pages with fewer extractable characters

dedup:
  enabled: true                          # dedup 파이프라인 전체 on/off
  ngram: 3                               # SimHash용 문자 n-gram 크기
  num_bands: 4                           # SimHash 밴드 수 (simhash_bits를 4등분, 밴드당 16비트)
  simhash_bits: 64                       # SimHash 시그니처 비트 수
  hamming_identical_threshold: 2         # 이 거리 이하면 "완전 동일"(identical_level)로 판정
  hamming_similar_threshold: 5           # 이 거리 이하면 SimHash 후보로 인정 (Stage1)
  jaccard_threshold: 0.65                # MinHash Jaccard가 이 값 이상이면 단독으로 "similar" 판정
  title_fuzzy_threshold: 0.85            # pg_trgm 제목 유사도 임계값 (title-only 경로 진입 조건)
  title_only_min_jaccard_floor: 0.25     # 제목이 비슷할 때, 본문 jaccard 최소 하한선 (개정판/재게시 탐지용)
  user_words_path: "data/kiwi_user_words.tsv"  # Kiwi 형태소 분석기 사용자 사전 경로

queue_worker:
  enabled: true   # true: FastAPI QueueWorker, false: Dagster sensor
  max_workers: 5

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10   # delay before retrying the same document

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  min_chunk_chars: 30      # discard chunks shorter than this after splitting
  semantic_threshold: 0.8
  code_chunk_lines: 40
  code_chunk_lines_overlap: 5

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://localhost:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"                # hybrid / similarity
  top_k: 5
  hybrid:
    alpha: 0.5                  # 1.0 = dense only, 0.0 = sparse only
    rrf_k: 60                   # RRF rank constant — higher value reduces score gap between ranks
  similarity:
    min_score: 0.0              # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true     # use RRF score as fallback if reranker fails

knowledge_bases:
  - id: "kb-01"
    name: "지식베이스 01"
    description: "첫 번째 지식베이스입니다."
    tags: ["general"]
  - id: "kb-02"
    name: "지식베이스 02"
    description: "두 번째 지식베이스입니다."

mcp:
  enabled: true
  transport: streamable-http    # stdio / sse / streamable-http

tracing:
  enabled: true
  langfuse_baseurl: "http://langfuse-web.llm.svc.cluster.local:3000"
  langfuse_public_key: "pk-lf-0142e4e5-b7e2-446f-8471-40be8d9c7009"
  langfuse_secret_key: "sk-lf-ad5e55e4-5a84-4442-ad6f-59170dff7900"
  service_name: "rag-api"

logging:
  level: INFO                   # DEBUG / INFO / WARNING / ERROR
  names: [rag_api]
