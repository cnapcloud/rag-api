name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: github-runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha4=$(git rev-parse --short=4 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=infra

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cnapcloud/rag-api:${{ steps.vars.outputs.sha4 }}
            ghcr.io/cnapcloud/rag-api:latest
