name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: github-runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure make is installed
        run: which make || (apt-get update && apt-get install -y make) || (sudo apt-get update && sudo apt-get install -y make)

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make sync

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=infra

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            make IMAGE_ORG=ghcr.io/cnapcloud IMAGE_TAG=${{ github.ref_name }} docker-push
          else
            make IMAGE_ORG=ghcr.io/cnapcloud docker-push
          fi
