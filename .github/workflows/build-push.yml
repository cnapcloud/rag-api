name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - "Dockerfile"
      - "tests/**"
      - "src/**"
      - "migrations/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: github-runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Ensure make is installed
        run: which make || (apt-get update && apt-get install -y make) || (sudo apt-get update && sudo apt-get install -y make)

      - uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: make sync

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            namespace=infra

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            make IMAGE_ORG=ghcr.io/cnapcloud IMAGE_TAG=${{ github.ref_name }} docker-push
          else
            make IMAGE_ORG=ghcr.io/cnapcloud docker-push
          fi

      - name: Trigger rag-ent-api build
        if: github.ref == 'refs/heads/main'
        env:
          AI_REPO_PAT: ${{ secrets.AI_REPO_PAT }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${AI_REPO_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cnapcloud/rag-ent-api/dispatches \
            -d '{"event_type":"rag-api-updated"}'
