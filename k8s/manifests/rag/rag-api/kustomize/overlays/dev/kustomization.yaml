apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm

resources:
  - ../../base

images:
  - name: cnapcloud/rag-api
    newName: cnapcloud/rag-api
    newTag: latest
  - name: cnapcloud/rag-admin
    newName: ghcr.io/cnapcloud/rag-admin
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: rag-api-config
    files:
      - settings.yaml=./configmaps/settings.yaml
  - name: admin-ui-config
    envs:
      - ./configmaps/admin-ui.yaml

secretGenerator:
  - name: rag-api-credentials
    envs:
      - ./secrets/rag-api-credentials.env
