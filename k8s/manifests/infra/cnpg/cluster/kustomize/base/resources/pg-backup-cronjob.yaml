apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-postgres-backup
spec:
  schedule: "0 3 * * *"  # Daily at 03:00 — cluster evaluates schedule in local time (KST), not UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
              env:
                - name: PGHOST
                  value: cnpg-postgres-rw.infra.svc.cluster.local
                - name: PGDATABASE
                  value: rag-api
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: rag-api-credentials
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rag-api-credentials
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  pg_dump -Fc -f /backup/rag-api_$(date +%Y%m%d).dump
                  echo "pg_dump done: $(ls -la /backup)"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: minio/mc:latest
              env:
                - name: MINIO_ENDPOINT
                  value: http://minio.infra.svc:9000
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: minio-root-secret
                      key: rootUser
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minio-root-secret
                      key: rootPassword
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  mc alias set local "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
                  mc cp /backup/rag-api_*.dump local/pg-backup/
                  echo "Upload done"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
