apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: dagster-credentials
    envs:
      - ./secrets/dagster-credentials.env
  - name: rag-api-credentials
    envs:
      - ./secrets/rag-api-credentials.env
  - name: langfuse-credentials
    envs:
      - ./secrets/langfuse-credentials.env
