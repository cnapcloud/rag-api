apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: infra

generators:
- ./helm/helm-chart.yaml

resources:
- ./resources/secret-smtp-auth.yaml

patches:
- target:
    kind: Deployment
    name: mailpit
  patch: |-
    - op: add
      path: /metadata/annotations
      value: {}
    - op: add
      path: /metadata/annotations/secret.reloader.stakater.com~1reload
      value: "mailpit-smtp-auth"