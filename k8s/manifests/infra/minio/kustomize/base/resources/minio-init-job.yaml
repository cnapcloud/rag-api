apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app.kubernetes.io/name: minio-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MINIO_ENDPOINT="http://minio.infra.svc:9000"

              echo "Waiting for MinIO to be ready..."
              until mc alias set local "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done

              echo "MinIO is ready. Initializing buckets..."
              mc mb --ignore-existing local/rag-api
              mc mb --ignore-existing local/dagster
              mc mb --ignore-existing local/mlflow
              mc mb --ignore-existing local/langfuse
              mc mb --ignore-existing local/rag-api-backup
              mc mb --ignore-existing local/pg-backup

              echo "Configuring webhook event subscription..."
              mc event add local/rag-api arn:minio:sqs::PRIMARY:webhook --event put,delete --ignore-existing

              echo "MinIO initialization complete."
