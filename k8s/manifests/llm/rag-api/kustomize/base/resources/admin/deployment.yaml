apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-admin
  template:
    metadata:
      labels:
        app: rag-admin
      annotations:
        configmap.reloader.stakater.com/reload: "admin-ui-config"       
    spec:
      imagePullSecrets:
        - name: ghcr-pull-token    
      containers:
        - name: rag-admin
          image: cnapcloud/rag-admin:latest
          
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Asia/Seoul
          envFrom:
            - configMapRef:
                name: admin-ui-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
