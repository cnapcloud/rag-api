apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
      annotations:
        configmap.reloader.stakater.com/reload: "rag-api-config"
        secret.reloader.stakater.com/reload: "rag-api-credentials"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-token
      containers:
        - name: rag-api
          image: cnapcloud/rag-api:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Seoul
          envFrom:
            - secretRef:
                name: rag-api-credentials
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: rag-api-config
              mountPath: /app/settings.yaml
              subPath: settings.yaml
              readOnly: true
      volumes:
        - name: rag-api-config
          configMap:
            name: rag-api-config
