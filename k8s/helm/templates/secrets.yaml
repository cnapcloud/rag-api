{{/*
Generic Secret factory driven by .Values.secrets (a map of secretName -> {key: value}).
Real values come from a separate, untracked values file (see k8s/values.yaml.example) —
never commit populated secrets here. Mirrors the mapping that used to live in each
kustomize overlay's secretGenerator.
*/}}
{{- range $name, $data := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
{{- end }}
