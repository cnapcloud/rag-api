{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rag-api.admin.fullname" . }}
  annotations:
    {{- toYaml .Values.admin.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.admin.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.admin.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rag-api.admin.fullname" . }}
                port:
                  number: 80
  tls:
    - secretName: {{ .Values.admin.ingress.tlsSecretName }}
      hosts:
        - {{ .Values.admin.ingress.host | quote }}
{{- end }}
