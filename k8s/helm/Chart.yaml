apiVersion: v2
name: rag-platform
description: rag-platform stack — rag-api/rag-admin (this chart) plus the full dependency stack as subcharts
version: 0.1.0
appVersion: latest

dependencies:
  # --- app-owned, no upstream chart ---
  - name: cnpg-cluster
    version: "0.1.0"
    repository: "file://./charts/cnpg-cluster"
    condition: cnpg-cluster.enabled
  - name: minio-jobs
    version: "0.1.0"
    repository: "file://./charts/minio-jobs"
    condition: minio-jobs.enabled
  - name: ollama
    version: "0.1.0"
    repository: "file://./charts/ollama"
    condition: ollama.enabled

  # --- upstream charts, fetched via `helm dependency update` (charts/*.tgz, gitignored) ---
  # cnpg-operator is NOT a dependency here — install it separately, once per cluster
  # (see README.md > Prerequisites). Bundling it into this release doesn't work: see
  # that section for why.
  - name: redis-ha
    version: "4.35.5"
    repository: "https://dandydeveloper.github.io/charts"
    condition: redis-ha.enabled
  - name: minio
    version: "5.4.0"
    repository: "https://charts.min.io"
    condition: minio.enabled
  - name: mailpit
    version: "0.34.1"
    repository: "https://jouve.github.io/charts"
    condition: mailpit.enabled
  - name: reloader
    version: "2.2.12"
    repository: "https://stakater.github.io/stakater-charts"
    condition: reloader.enabled
  - name: qdrant
    version: "1.18.2"
    repository: "https://qdrant.github.io/qdrant-helm"
    condition: qdrant.enabled
  - name: dagster
    version: "1.13.8"
    repository: "https://dagster-io.github.io/helm"
    condition: dagster.enabled
