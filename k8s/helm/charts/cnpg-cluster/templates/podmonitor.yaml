{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.clusterName }}
  labels:
    {{- toYaml .Values.podMonitor.additionalLabels | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.clusterName }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
