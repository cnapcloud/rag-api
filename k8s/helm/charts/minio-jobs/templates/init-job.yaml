apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app.kubernetes.io/name: minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret }}
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret }}
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MINIO_ENDPOINT="{{ .Values.minio.endpoint }}"

              echo "Waiting for MinIO to be ready..."
              until mc alias set local "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done

              echo "MinIO is ready. Initializing buckets..."
              {{- range .Values.buckets }}
              mc mb --ignore-existing local/{{ . }}
              {{- end }}

              echo "Configuring webhook event subscription..."
              mc event add local/{{ .Values.eventBucket }} {{ .Values.eventArn }} --event {{ .Values.eventTypes }} --ignore-existing

              echo "MinIO initialization complete."
