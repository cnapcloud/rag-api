apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
endpoints:
  - addresses:
      - {{ required "ollama.externalIP is required (external Ollama host IP)" .Values.externalIP | quote }}
ports:
  - port: {{ .Values.port }}
    protocol: TCP
