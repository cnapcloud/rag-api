dagster:
  endpoint: "http://dagster-webserver:3000"

s3:
  endpoint: "http://minio:9000"
  access_key: "minioadmin"   # matches MINIO_ROOT_USER in .env
  secret_key: "minioadmin"   # matches MINIO_ROOT_PASSWORD in .env
  rag_bucket: "rag-api"
  dagster_bucket: "dagster-storage"
  region: "us-east-1"
  insecure: true

postgres:
  host: "postgresql"
  port: 5432
  dbname: "rag-api"
  user: "rag-api"
  password: "password"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "qdrant"
  port: 6333
  insecure: true

redis:
  host: "redis"
  port: 6379
  password: "redis"
  db: 0

ingestion:
  max_file_size_mb: 10

queue_worker:
  enabled: false # true이면 dagster가 비활성화됨
  max_workers: 4

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  min_chunk_chars: 30
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://192.168.0.75:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 10
  hybrid:
    alpha: 0.5                  # alpha=1.0 -> dense only, alpha=0.0 -> sparse only
    rrf_k: 60
  similarity:
    min_score: 0.0              # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: true
    provider: "jina"
    api_key: jina_026dc0b5a8ff4e6480914e208c1e0682eZK1BWvhq7gdXbQQxRPjP2rZXFo-"
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    name: "지식베이스 01"
    tags: ["general", "default"]
    description: "첫 번째 지식베이스입니다."
  - id: "kb-02"
    name: "지식베이스 02"
    description: "두 번째 지식베이스입니다."

mcp:
  enabled: true
  transport: streamable-http
  host: "0.0.0.0"
  port: 8001

tracing:
  enabled: false
  langfuse_baseurl: ""
  langfuse_public_key: ""
  langfuse_secret_key: ""
  service_name: "rag-api"

logging:
  level: INFO
