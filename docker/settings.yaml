server:
  production: true
  workers: 1 

dagster:
  endpoint: "http://dagster-webserver:3000"

s3:
  endpoint: "http://minio:9000"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  insecure: true

postgres:
  host: "postgresql"
  port: 5432
  dbname: "rag-api"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "qdrant"
  port: 6333
  insecure: true

redis:
  host: "redis"
  port: 6379
  db: 0

ingestion:
  max_file_size_mb: 10
  min_content_chars: 200
  
dedup:
  enabled: true                          # dedup 파이프라인 전체 on/off
  ngram: 3                               # SimHash용 문자 n-gram 크기
  num_bands: 4                           # SimHash 밴드 수 (simhash_bits를 4등분, 밴드당 16비트)
  simhash_bits: 64                       # SimHash 시그니처 비트 수
  hamming_identical_threshold: 2         # 이 거리 이하면 "완전 동일"(identical_level)로 판정
  hamming_similar_threshold: 5           # 이 거리 이하면 SimHash 후보로 인정 (Stage1)
  jaccard_threshold: 0.65                # MinHash Jaccard가 이 값 이상이면 단독으로 "similar" 판정
  title_fuzzy_threshold: 0.85            # pg_trgm 제목 유사도 임계값 (title-only 경로 진입 조건)
  title_only_min_jaccard_floor: 0.25     # 제목이 비슷할 때, 본문 jaccard 최소 하한선 (개정판/재게시 탐지용)
  user_words_path: "/data/kiwi_user_words.tsv"  # Kiwi 형태소 분석기 사용자 사전 경로
  chunk_match_threshold: 0.50            # 청크쌍 필터 임계값 (Stage3 Top-1 매칭 최소 점수)
  body_identical_threshold: 0.95         # 집계 점수가 이 값 이상이면 body=identical
  body_similar_threshold: 0.75           # 집계 점수가 이 값 이상(identical 미만)이면 body=similar, 미만은 none
  compare_all_candidates: false          # false=best match 1건만 chunk_compare, true=candidate_doc_ids 전체 순회

queue_worker:
  enabled: false # true이면 dagster가 비활성화됨
  max_workers: 4

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  min_chunk_chars: 30
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://192.168.0.75:11434"
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 10
  hybrid:
    alpha: 0.5                  # alpha=1.0 -> dense only, alpha=0.0 -> sparse only
    rrf_k: 60
  similarity:
    min_score: 0.0              # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: true
    provider: "jina"
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    name: "지식베이스 01"
    tags: ["general", "default"]
    description: "첫 번째 지식베이스입니다."
  - id: "kb-02"
    name: "지식베이스 02"
    description: "두 번째 지식베이스입니다."

mcp:
  enabled: true
  transport: streamable-http
  host: "0.0.0.0"
  port: 8001

tracing:
  enabled: false
  langfuse_baseurl: ""
  service_name: "rag-api"

logging:
  level: INFO
