s3:
  endpoint: "http://minio:9000"
  access_key: "minioadmin"   # matches MINIO_ROOT_USER in .env
  secret_key: "minioadmin"   # matches MINIO_ROOT_PASSWORD in .env
  rag_bucket: "rag-api"
  dagster_bucket: "dagster-storage"
  region: "us-east-1"
  poll_interval_sec: 10
  insecure: true

qdrant:
  host: "qdrant"
  port: 6333
  insecure: true

redis:
  host: "redis"
  port: 6379
  password: "redis"
  db: 0

ingestion:
  max_file_size_mb: 200
  max_workers: 4             # QueueWorker 전용 — queue_worker_enabled: true 일 때만 사용
  poll_interval_sec: 5        # Redis 큐 폴링 주기 (초)
  max_runs_per_tick: 5        # Dagster sensor 한 tick당 최대 RunRequest 수
  processing_delay_sec: 10    # delay queue retry interval (seconds)
  queue_worker_enabled: true  # QueueWorker 활성화

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://192.168.0.75:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 10
  alpha: 0.5
  merge_strategy: "rrf"
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    description: "지식베이스 01"
  - id: "kb-02"
    description: "지식베이스 02"

dagster:
  executor: "in_process"  

mcp:
  enabled: true
  transport: streamable-http

logging:
  level: INFO
