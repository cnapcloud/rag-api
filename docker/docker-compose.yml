x-env-file: &env-file
  env_file:
    - .env

services:

  rag-api:
    <<: *env-file
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag-api
    volumes:
      - ./settings.yaml:/app/settings.yaml:ro
      - ./data/kiwi_user_words.tsv:/app/data/kiwi_user_words.tsv:ro
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  rag-admin:
    <<: *env-file
    build:
      context: ../../rag-admin
      dockerfile: Dockerfile
    container_name: rag-admin
    environment:
      API_URL: http://rag-api:8000
    ports:
      - "8080:80"
    depends_on:
      rag-api:
        condition: service_started

  dagster-rag-api:
    <<: *env-file
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dagster-rag-api
    stop_grace_period: 120s
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m rag_api.defs.definitions
    environment:
      PYTHONPATH: /app/src
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - ./settings.yaml:/app/settings.yaml:ro
      - ./data/kiwi_user_words.tsv:/app/data/kiwi_user_words.tsv:ro
      # compute_logs, io_logs will be stored here
      # io manager s3를 사용하는 경우, compute_logs만 저장
      - dagster-storage:/opt/dagster/dagster_home/storage
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-h", "0.0.0.0", "-p", "4000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dagster-webserver:
    <<: *env-file
    build:
      context: ..
      dockerfile: Dockerfile.dagster
    container_name: dagster-webserver
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    ports:
      - "3000:3000"
    depends_on:
      postgresql:
        condition: service_healthy
      dagster-rag-api:
        condition: service_healthy

  dagster-daemon:
    <<: *env-file
    build:
      context: ..
      dockerfile: Dockerfile.dagster
    container_name: dagster-daemon
    command:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    depends_on:
      postgresql:
        condition: service_healthy
      dagster-rag-api:
        condition: service_healthy

  postgresql:
    <<: *env-file
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *env-file
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    <<: *env-file
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    <<: *env-file
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    <<: *env-file
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
      rag-api:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/rag-api;
      mc mb --ignore-existing local/dagster;
      echo 'MinIO buckets initialized';
      "
    restart: "no"

  mailpit:
    <<: *env-file
    image: axllent/mailpit:v1.29.6
    container_name: mailpit
    restart: unless-stopped

    command:
      - --db-file
      - /var/lib/mailpit/mailpit.db
      - --webroot
      - /
      - --smtp-auth-file
      - /etc/mailpit/smtp.htpasswd
      - --smtp-auth-allow-insecure

    environment:
      TZ: Asia/Seoul

    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

    volumes:
      - ./data/mailpit:/var/lib/mailpit
      - ./smtp.htpasswd:/etc/mailpit/smtp.htpasswd:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
  dagster-storage:
  redis-data:
  qdrant-data:
  minio-data:

networks:
  rag_api_network:
      driver: bridge