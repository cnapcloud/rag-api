services:

  rag-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag-api
    env_file:
      - .env
    volumes:
      - ./settings.yaml:/app/settings.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  rag-admin:
    build:
      context: ../../rag-admin
      dockerfile: Dockerfile
    container_name: rag-admin
    environment:
      API_URL: http://rag-api:8000
    ports:
      - "8080:80"
    depends_on:
      rag-api:
        condition: service_started

  dagster-rag-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dagster-rag-api
    command: dagster api grpc -h 0.0.0.0 -p 4000 -f src/defs/definitions.py
    environment:
      PYTHONPATH: /app/src
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - dagster-storage:/opt/dagster/dagster_home/storage
      - ./settings.yaml:/app/settings.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      postgresql:
        condition: service_healthy

  dagster-webserver:
    build:
      context: ..
      dockerfile: Dockerfile.dagster
    container_name: dagster-webserver
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    ports:
      - "3000:3000"
    depends_on:
      postgresql:
        condition: service_healthy
      dagster-rag-api:
        condition: service_started

  dagster-daemon:
    build:
      context: ..
      dockerfile: Dockerfile.dagster
    container_name: dagster-daemon
    command:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_URL: postgresql://dagster:password@postgresql:5432/dagster
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    depends_on:
      postgresql:
        condition: service_healthy
      dagster-rag-api:
        condition: service_started

  postgresql:
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: "http://rag-api:8000/internal/s3-event"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
      rag-api:
        condition: service_started
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/rag-api;
      mc mb --ignore-existing local/dagster-storage;
      mc event add local/rag-api arn:minio:sqs::PRIMARY:webhook --event put,delete --ignore-existing;
      echo 'MinIO webhook event subscription configured';
      "
    restart: "no"

volumes:
  pg_data:
  dagster-storage:
  redis-data:
  qdrant-data:
  minio-data:
