server:
  production: false   # true: disables --reload, enables `workers` (env: SERVER_PRODUCTION)
  workers: 1           # only used when production=true (env: SERVER_WORKERS)

dagster:
  endpoint: "http://localhost:3000"

s3:
  endpoint: "http://<minio-host>:9000"
  access_key: "<access-key>"
  secret_key: "<secret-key>"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  insecure: true

postgres:
  host: "<postgres-host>"
  port: 5432
  dbname: "rag-api"
  user: "<user>"
  password: "<password>"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "<qdrant-host>"
  port: 6333
  insecure: true

redis:
  host: "<redis-host>"
  port: 6379
  password: "<password>"
  db: 0
  timeout_seconds: 2.0   # socket_connect_timeout / socket_timeout — keeps a hung Redis from blocking the event loop

ingestion:
  max_file_size_mb: 200
  min_content_chars: 200
  html_extraction_policy: "lenient"   # strict | lenient | balanced — HTMLCleanReader trafilatura bias

queue_worker:
  enabled: true   # true: FastAPI QueueWorker, false: Dagster sensor
  max_workers: 4

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10    # retry interval for the same document

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  min_chunk_chars: 30
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://<ollama-host>:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"           # hybrid | similarity
  top_k: 10
  hybrid:
    alpha: 0.5             # alpha=1.0 → dense only, alpha=0.0 → sparse only
    rrf_k: 60              # RRF rank constant — higher value reduces score gap between ranks
  similarity:
    min_score: 0.0         # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    name: "Knowledge Base 01"
    description: "First knowledge base."
  - id: "kb-02"
    name: "Knowledge Base 02"
    description: "Second knowledge base."

mcp:
  enabled: true
  transport: streamable-http

tracing:
  enabled: false
  langfuse_baseurl: "http://<langfuse-host>:3000"
  langfuse_public_key: "<public-key>"
  langfuse_secret_key: "<secret-key>"
  service_name: "rag-api"

logging:
  level: INFO
