server:
  production: false   # true: disables --reload, enables `workers` (env: SERVER_PRODUCTION)
  workers: 1           # only used when production=true (env: SERVER_WORKERS)

dagster:
  endpoint: "http://localhost:3000"

s3:
  endpoint: "http://<minio-host>:9000"
  access_key: "<access-key>"
  secret_key: "<secret-key>"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  insecure: true

postgres:
  host: "<postgres-host>"
  port: 5432
  dbname: "rag-api"
  user: "<user>"
  password: "<password>"
  pool_size: 5
  connect_timeout: 30

qdrant:
  host: "<qdrant-host>"
  port: 6333
  insecure: true

redis:
  host: "<redis-host>"
  port: 6379
  password: "<password>"
  db: 0
  timeout_seconds: 2.0   # socket_connect_timeout / socket_timeout — keeps a hung Redis from blocking the event loop

ingestion:
  max_file_size_mb: 200
  min_content_chars: 200
  html_extraction_policy: "lenient"   # strict | lenient | balanced — HTMLCleanReader trafilatura bias

queue_worker:
  enabled: true   # true: FastAPI QueueWorker, false: Dagster sensor
  max_workers: 4

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10    # retry interval for the same document

chunking:
  strategy: "recursive"    # recursive | semantic | hierarchical
  chunk_size: 1024          # hierarchical: list instead, e.g. [2048, 512]
                            # (largest -> smallest, last = leaf/search unit, must be descending)
  chunk_overlap: 128         # hierarchical: applied to the leaf level only (root/mid use 0)
                              # must not exceed 15% of chunk_size (US-49)
  min_chunk_chars: 30
  semantic_threshold: 0.8

provider:
  name: "ollama"                # ollama | openai | jina | <else = OpenAI-compatible fallback, name used as-is>
  url: "http://<ollama-host>:11434"   # empty = provider default (ollama: bare host / OpenAI-compatible: include /v1)
  api_key: ""                  # openai / jina / OpenAI-compatible (also injected from OPENAI_API_KEY)

embedding:
  model: "bge-m3"              # model name for the provider (ollama: bge-m3 / openai: text-embedding-3-small)
  vector_size: 1024            # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536

retrieval:
  mode: "hybrid"           # hybrid | similarity
  top_k: 10
  hybrid:
    alpha: 0.5             # alpha=1.0 → dense only, alpha=0.0 → sparse only
    rrf_k: 60              # RRF rank constant — higher value reduces score gap between ranks
  similarity:
    min_score: 0.0         # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: false
    provider: "jina"              # jina | internal (자체 호스팅 Cohere-compatible rerank 서버)
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    base_url: ""                  # provider=internal일 때만 사용 (예: http://reranker:8080/rerank)
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true
  auto_merge:
    enabled: false                # chunking.strategy="hierarchical"일 때만 의미 있음
    merge_threshold: 0.5

knowledge_bases:
  - id: "kb-01"
    name: "Knowledge Base 01"
    description: "First knowledge base."
  - id: "kb-02"
    name: "Knowledge Base 02"
    description: "Second knowledge base."

mcp:
  enabled: true
  transport: streamable-http

tracing:
  enabled: false
  langfuse_baseurl: "http://<langfuse-host>:3000"
  langfuse_public_key: "<public-key>"
  langfuse_secret_key: "<secret-key>"
  service_name: "rag-api"

logging:
  level: INFO
