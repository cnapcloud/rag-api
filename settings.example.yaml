s3:
  endpoint: "http://<minio-host>:9000"
  access_key: "<access-key>"
  secret_key: "<secret-key>"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster"
  region: "us-east-1"
  poll_interval_sec: 10
  insecure: true

qdrant:
  host: "<qdrant-host>"
  port: 6333
  insecure: true

redis:
  host: "<redis-host>"
  port: 6379
  password: "<password>"
  db: 0

ingestion:
  max_file_size_mb: 200

queue_worker:
  enabled: true             # true: FastAPI QueueWorker 처리 (Dagster 센서 비활성화), false: Dagster 센서 처리
  max_workers: 4

queue_poll:
  poll_interval_sec: 5
  max_per_poll: 5
  retry_interval_sec: 10    # 동일 문서 재시도 간격

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://<ollama-host>:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"           # hybrid | similarity
  top_k: 10
  hybrid:
    alpha: 0.5             # alpha=1.0 → dense only, alpha=0.0 → sparse only
    merge_strategy: "rrf"
  similarity:
    min_score: 0.0         # 0.0 = no filter; set e.g. 0.4 to discard low-similarity results
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    description: "지식베이스 01"
  - id: "kb-02"
    description: "지식베이스 02"

mcp:
  enabled: true
  transport: stdio

logging:
  level: INFO
