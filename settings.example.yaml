s3:
  endpoint: "http://<minio-host>:9000"
  access_key: "<access-key>"
  secret_key: "<secret-key>"
  rag_bucket: "rag-api"
  dagster_bucket: "dagster-storage"
  region: "us-east-1"
  poll_interval_sec: 10
  insecure: true

qdrant:
  host: "<qdrant-host>"
  port: 6333
  insecure: true

redis:
  host: "<redis-host>"
  port: 6379
  password: "<password>"
  db: 0

ingestion:
  max_file_size_mb: 200
  max_workers: 4            # QueueWorker 전용 — queue_worker_enabled: true 일 때만 사용
  poll_interval_sec: 5      # Redis 큐 폴링 주기 (초)
  max_runs_per_tick: 5      # Dagster sensor 한 tick당 최대 RunRequest 수
  processing_delay_sec: 10  # delay queue retry interval (seconds)
  queue_worker_enabled: true  # true: FastAPI QueueWorker 처리 (Dagster 센서 비활성화), false: Dagster 센서 처리

chunking:
  strategy: "recursive"    # recursive / semantic
  chunk_size: 1024
  chunk_overlap: 128
  semantic_threshold: 0.8

embedding:
  provider: "ollama"            # ollama / openai
  model: "bge-m3"
  vector_size: 1024             # bge-m3=1024, text-embedding-3-small=1536, ada-002=1536
  ollama_url: "http://<ollama-host>:11434"
  openai_api_key: ""
  openai_model: "text-embedding-3-small"

retrieval:
  mode: "hybrid"
  top_k: 10
  alpha: 0.5 # alpha=1.0 → dense(벡터 유사도 100%), alpha=0.0 → sparse(키워드 매칭 100%)
  merge_strategy: "rrf"
  rerank:
    enabled: false
    provider: "jina"
    api_key: ""
    model: "jina-reranker-v2-base-multilingual"
    top_n: 3
    timeout_sec: 5
    fallback_on_error: true

knowledge_bases:
  - id: "kb-01"
    description: "지식베이스 01"
  - id: "kb-02"
    description: "지식베이스 02"

dagster:
  executor: "in_process"  # in_process | k8s

mcp:
  enabled: true
  transport: stdio

logging:
  level: INFO
